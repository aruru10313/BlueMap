name: Build BlueMap NeoForge 1.21.1

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build NeoForge Mod & Webapp
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Webapp
        run: |
          cd common/webapp
          npm ci
          npm run build

      - name: Build NeoForge 1.21.1
        run: ./gradlew :neoforge:release --no-daemon --stacktrace

      - name: Upload NeoForge Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueMap-NeoForge-1.21.1
          path: |
            build/release/*.jar
            implementations/neoforge/build/libs/*.jar
          if-no-files-found: error
